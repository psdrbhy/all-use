name: Collect verified subscription prices

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verified-price-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run collect:prices
      - name: Probe regional web prices
        env:
          REGIONAL_PROXY_MAP_JSON: ${{ secrets.REGIONAL_PROXY_MAP_JSON }}
        run: npm run collect:regional -- --storefront=PH,PK,CA,JP,KR,BR,US,IN,AU,TR,MX,DE,FR,GB,DK --channel=web
      - run: npm run build:regional
      - run: npm run test:collector
      - run: npm run build
      - name: Save accepted snapshot
        run: |
          if git diff --quiet -- data; then
            exit 0
          fi
          git config user.name "subscription-radar-bot"
          git config user.email "subscription-radar-bot@users.noreply.github.com"
          git add data/verified-prices.json data/collection-status.json data/runs data/verified-regional-prices.json data/regional-collection-status.json data/regional-runs data/regional-probes data/evidence/inbox
          git commit -m "data: refresh verified subscription prices"
          git push
      - name: Preserve run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-collection-run
          path: data/runs/
          retention-days: 30
